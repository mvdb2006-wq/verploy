<!doctype html>
<html>
  <body style="margin:0;padding:0;background:#f4f5f7;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,Helvetica,Arial,sans-serif;">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f7;padding:32px 16px;">
      <tr>
        <td align="center">
          <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:480px;background:#ffffff;border-radius:14px;overflow:hidden;border:1px solid #e6e8eb;">
            <tr>
              <td style="padding:28px 32px 0 32px;">
                <span style="display:inline-block;font-size:20px;font-weight:700;color:#0b0f19;letter-spacing:-0.02em;">
                  <span style="color:#00c176;">&#10003;</span> Verploy
                </span>
              </td>
            </tr>
            <tr>
              <td style="padding:20px 32px 8px 32px;">
                <h1 style="margin:0;font-size:22px;line-height:1.3;color:#0b0f19;font-weight:700;letter-spacing:-0.01em;">Confirm it's you</h1>
              </td>
            </tr>
            <tr>
              <td style="padding:0 32px;">
                <p style="margin:0;font-size:15px;line-height:1.6;color:#4b5563;">Enter this code in Verploy to continue:</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 8px 32px;">
                <p style="margin:0;display:inline-block;background:#f4f5f7;border:1px solid #e6e8eb;border-radius:10px;padding:12px 20px;font-size:26px;font-weight:700;letter-spacing:0.25em;color:#0b0f19;font-family:'SFMono-Regular',Menlo,Consolas,monospace;">{{ .Token }}</p>
              </td>
            </tr>
            <tr>
              <td style="padding:24px 32px 28px 32px;border-top:1px solid #eef0f2;margin-top:16px;">
                <p style="margin:16px 0 0 0;font-size:13px;line-height:1.6;color:#9ca3af;">Didn't request a code? Someone may know your password &mdash; change it and turn on two-step verification.</p>
                <p style="margin:12px 0 0 0;font-size:13px;line-height:1.6;color:#9ca3af;">Questions? Email <a href="mailto:team@verploy.com" style="color:#9ca3af;">team@verploy.com</a>.<br>&mdash; The Verploy team</p>
              </td>
            </tr>
          </table>
          <p style="max-width:480px;margin:16px auto 0 auto;font-size:12px;color:#b0b4ba;text-align:center;">Verploy &middot; EM Hosting &amp; Design &middot; <a href="https://verploy.com" style="color:#b0b4ba;">verploy.com</a></p>
        </td>
      </tr>
    </table>
  </body>
</html>
